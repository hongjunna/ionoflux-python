name: pypi release preparation
on:
  push:
    tags: ['python-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate tag, source ancestry, main CI and unpublished version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py gate pypi
      - run: python -m pip install -r .github/release/requirements.txt
      - name: Build reviewed reproducible artifacts
        run: |
          export SOURCE_DATE_EPOCH=$(python -c 'import json; print(json.load(open(".github/release/0.1.3.json"))["source_date_epoch"])')
          python -m build --no-isolation
          python -m twine check dist/*
          python scripts/check_artifacts.py
          python scripts/check_install.py
          python scripts/release.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    # Manual dispatch only validates. Publication requires an exact tag push AND manual environment approval.
    if: github.event_name == 'push' && github.repository == 'hongjunna/ionoflux-python'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
      - name: Verify downloaded artifacts
        working-directory: dist
        run: |
          sha256sum --strict --check SHA256SUMS
          rm SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: false
          attestations: true
