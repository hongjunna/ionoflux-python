name: SDK live API smoke (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-smoke-main
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'hongjunna/ionoflux-python' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: sdk-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify trusted dispatch commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install trusted SDK and schema checker (no API key available)
        run: python -m pip install . 'jsonschema>=4.23,<5'
      - name: Sequential read-only acceptance (at most 9 requests, no retries)
        env:
          IONOFLUX_API_KEY: ${{ secrets.IONOFLUX_API_KEY }}
          IONOFLUX_BASE_URL: ${{ vars.IONOFLUX_BASE_URL }}
        run: python .github/scripts/sdk_smoke.py
