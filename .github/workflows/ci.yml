name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: ubuntu-latest, python: '3.15'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: ubuntu-latest, python: '3.11', httpx: '==0.27.0'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - if: matrix.httpx
        run: python -m pip install "httpx${{ matrix.httpx }}"
      - run: python -m pytest
      - run: python examples/offline.py
  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pip install -r .github/release/requirements.txt
      - name: Build reproducible release candidate
        run: |
          export SOURCE_DATE_EPOCH=$(python -c 'import json; print(json.load(open(".github/release/0.1.2.json"))["source_date_epoch"])')
          python -m build --no-isolation
      - run: python -m twine check dist/*
      - run: python scripts/check_readme.py
      - run: python scripts/check_artifacts.py
      - run: python scripts/check_install.py
      - run: python scripts/release.py verify
